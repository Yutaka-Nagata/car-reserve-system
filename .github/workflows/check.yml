name: check-slots

on:
  schedule:
    - cron: "2 0-15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-slots
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt

      - name: 空き枠をチェック
        env:
          NCORS_USER: ${{ secrets.NCORS_USER }}
          NCORS_PASS: ${{ secrets.NCORS_PASS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python main.py

      - name: state.jsonを更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "chore: 【定期実行】stateを更新"
          git push
          
          
