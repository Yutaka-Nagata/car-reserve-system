name: check-slots

# GitHub の cron は起動時刻を保証しない（実測で平均42分遅れ、大半が実行されなかった）。
# そこで「毎時起動する」のをやめ、「1日3回起動して、各回が数時間ループする」形にしている。
# 起動が遅れても、ジョブが長く居座るので穴が空きにくい。
#
# concurrency で直列化されるため、3回の起動は実際には次のように連なる。
#   1本目 9:07 起動 → 14:37 まで（MAX_RUNTIME_SEC で自分から終わる）
#   2本目 12:07 分は待機 → 1本目の終了後に始まり、19:52 まで
#   3本目 15:07 分は待機 → 稼働時間を過ぎているので即終了
# 1本目が落とされても、2本目・3本目が残りを拾う。

on:
  schedule:
    # UTC。JST 9:07〜18:07 の毎時。
    # GitHub は schedule を落とすので、数を増やして「どれか1本でも当たればいい」形にしている。
    # 当たった1本が数時間ループし、残りは concurrency で待機→稼働時間外なら即終了になる。
    # 待機は常に1本までで、新しいものが来ると古い待機は取り消されるので積み上がらない。
    - cron: "7 0-9 * * *"
  workflow_dispatch:
    inputs:
      once:
        description: "1回だけチェックして終了する（動作確認用。稼働時間外でも実行できる）"
        type: boolean
        default: false

concurrency:
  group: check-slots
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # 自前の MAX_RUNTIME_SEC（5.5時間）より少しだけ後ろに置く保険
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # f-string の入れ子クォートを使っているので 3.12 以上が必須
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: 空き枠を監視
        env:
          ONCE: ${{ inputs.once && '1' || '' }}
          NCORS_USER: ${{ secrets.NCORS_USER }}
          NCORS_PASS: ${{ secrets.NCORS_PASS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python main.py
